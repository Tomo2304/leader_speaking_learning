name: Saturday Weekly Prep

on:
  schedule:
    - cron: '0 23 * * 5'  # 9:00am AEST  (UTC+10) Saturday
    - cron: '0 22 * * 5'  # 9:00am AEDT (UTC+11) Saturday
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send weekly prep to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/saturday_prep.py
