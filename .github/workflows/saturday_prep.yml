name: Saturday Weekly Prep

on:
  schedule:
    - cron: '0 11 * * 6'  # 9:00pm AEST (UTC+10) Saturday
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send weekly prep to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/saturday_prep.py
