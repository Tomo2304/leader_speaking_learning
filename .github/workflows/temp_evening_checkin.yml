name: Temp Evening Check-in Dispatch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp_evening_checkin.yml']

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send evening check-in to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/evening_checkin.py
