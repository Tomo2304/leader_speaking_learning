# Re-enabled 2026-08-19
name: Evening Check-in

on:
  schedule:
    - cron: '0 10 * * 1-6'  # 8:00pm AEST  (UTC+10) Mon-Sat
    - cron: '0 9 * * 1-6'   # 8:00pm AEDT (UTC+11) Mon-Sat
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send evening check-in to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/evening_checkin.py
