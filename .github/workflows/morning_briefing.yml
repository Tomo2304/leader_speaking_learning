name: Morning Task Briefing

on:
  schedule:
    - cron: '40 21 * * 0-4'  # 7:40am AEST (UTC+10) Mon-Fri
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send morning briefing to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/morning_briefing.py
